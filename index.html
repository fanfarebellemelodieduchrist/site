<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belle Mélodie du Christ</title>
  <link rel="icon" type="image/png" href="logo.jpg" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100%;
      background-color: #05775b; /* fond vert */
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* LOGO ARS */
    .ars-logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 120px;
      height: auto;
      z-index: 10;
    }

    /* LOGO CENTRAL */
    .center-container {
      position: relative;
      text-align: center;
    }

    .main-logo {
      width: 800px; /* logo principal */
      height: auto;
      display: block;
      margin: auto;
    }

    /* TEXTE SUR LE LOGO */
    h1 {
      font-size: 2rem;
      color: #fff;
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    /* Effet “lettres une à une” */
    .typing {
      display: inline-block;
      border-right: 3px solid #fff;
      white-space: nowrap;
      overflow: hidden;
      /* largeur du conteneur = 0 au départ */
      width: 0;
      /* steps(N,end) N = nombre de caractères */
      animation: typing 6s steps(45,end) forwards, blink .7s infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% } /* on montre tout à la fin */
    }

    @keyframes blink {
      0% { border-color: transparent }
      50% { border-color: white }
      100% { border-color: transparent }
    }

    @media (max-width: 768px) {
      .main-logo {
        width: 200px;
      }
      h1 {
        font-size: 1.2rem;
      }
      .ars-logo {
        width: 80px;
      }
    }

    /* Logo ARS à gauche */
.ars-logo-left {
  position: absolute;
  top: 20px;
  left: 20px;
  width: 120px;
  height: auto;
  z-index: 10;
}

/* Logo ARS à droite */
.ars-logo-right {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 120px;
  height: auto;
  z-index: 10;
}

  </style>
</head>
<body>

<!-- Logo ARS à gauche -->
<img src="ARS.jpg" alt="Logo ARS gauche" class="ars-logo-left">

<!-- Logo ARS à droite -->
<img src="ARS.jpg" alt="Logo ARS droite" class="ars-logo-right">

  <!-- Logo central + texte -->
  <div class="center-container">
     <a href="accueil.html">
    <img src="logo.jpg" alt="Logo principal" class="main-logo">
  </a>
    <h1><span class="typing">BIENVENUE LA BELLE MELODIE DU CHRIST</span></h1>
  </div>

</body>
</html>
